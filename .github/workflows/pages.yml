name: Verify and deploy Math Survival 3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: math-survival-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        env:
          BROWSER_CHANNEL: chromium
        run: |
          node scripts/serve.cjs > /tmp/math-survival-preview.log 2>&1 &
          node scripts/wait-ready.mjs
          npm run test:browser
          npm run test:preferences
          npm run test:typography
          npm run test:movement
          npm run test:sprites
          npm run test:curriculum-screen
          npm run test:v3
          npm run test:simple-play
          node tests/compact-home.cjs
          node tests/mobile-gestures.cjs
          node tests/mobile-refresh.cjs
          node tests/mobile-lifecycle.cjs
          node tests/response-timing-browser.cjs
          node tests/growth-restore.cjs
          node tests/modal-race.cjs
          node tests/boss-route.cjs
          for profile in small-phone phone-landscape tablet-portrait; do DEVICE_ENGINE=chromium DEVICE_PROFILE="$profile" node tests/mobile-tablet.cjs; done
          node tests/mobile-size.cjs
          node tests/world-browser.cjs
          node tests/world-playtest.cjs
          node tests/item-keyboard.cjs
          node tests/answer-keyboard.cjs
          node tests/menu-keyboard.cjs
          node tests/review-export.cjs
          node tests/question-cue.cjs
          node tests/first-paint.cjs
          node tests/bgm-browser.cjs
          node tests/fullscreen.cjs
      - run: npm run build
      - name: Built startup recovery and offline regression
        run: |
          PORT=4174 STATIC_ROOT="$PWD/dist" node scripts/serve.cjs > /tmp/math-survival-build.log 2>&1 &
          READY_URL=http://127.0.0.1:4174/Math-Survival/ node scripts/wait-ready.mjs
          node tests/startup.cjs
          npm run test:build-browser
          node tests/growth-offline.cjs
          GAME_URL=http://127.0.0.1:4174/Math-Survival/ BGM_OFFLINE=1 node tests/bgm-browser.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Safari (WebKit) regression
        env:
          ENGINES: webkit
        run: |
          node scripts/serve.cjs > /tmp/math-survival-preview.log 2>&1 &
          node scripts/wait-ready.mjs
          npm run test:preferences
          npm run test:typography
          npm run test:sprites
          npm run test:simple-play
          node tests/compact-home.cjs
          node tests/item-keyboard.cjs
          node tests/answer-keyboard.cjs
          node tests/menu-keyboard.cjs
          node tests/question-cue.cjs
          node tests/bgm-browser.cjs
          npm run build
          node tests/response-timing-browser.cjs
          ENGINE=webkit node tests/growth-restore.cjs
          node tests/modal-race.cjs
          for profile in small-phone phone-landscape tablet-portrait; do DEVICE_ENGINE=webkit DEVICE_PROFILE="$profile" node tests/mobile-tablet.cjs; done
          PORT=4174 STATIC_ROOT="$PWD/dist" node scripts/serve.cjs > /tmp/math-survival-build.log 2>&1 &
          READY_URL=http://127.0.0.1:4174/Math-Survival/ node scripts/wait-ready.mjs
          node tests/startup.cjs
  deploy:
    needs: [verify, webkit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static files
        id: deployment
        uses: actions/deploy-pages@v4
